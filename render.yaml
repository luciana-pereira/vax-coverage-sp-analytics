services:
  - type: web
    name: vax-coverage-sp-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: ANALYTICS_DB_PATH
        value: backend/data/demo/vax.duckdb
