name: ci

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  python:
    name: backend, pipeline e ml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt
            pipeline/requirements.txt
            ml/requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check backend pipeline ml tests scripts
      - name: Testes
        run: pytest

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
